<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exhale</title>
<meta name="description" content="Let your thoughts out. Exhale takes them, keeps them, and shows which ones keep coming back.">
<meta name="theme-color" content="#080a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exhale">
<meta property="og:title" content="Exhale">
<meta property="og:image" content="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg-canvas:#080a0a; --bg-deep:#00110d; --bg-ambient:#031310;
    --surface-raised:#0f1c1c; --surface-sunk:#0b1211;
    --jade-700:#0e4a3d; --jade-500:#135244; --jade-300:#1b5a4c;
    --aqua-400:#2feada; --aqua-600:#2cb7af;
    --text-primary:#ecf2f4; --text-secondary:#d5d7d7; --text-muted:#80838e; --text-faint:#4a5452;
    --border-hairline:#273132;
    --glow-aqua:0 0 28px 0 #2feada40;
    --edge-lift:0 8px 24px 0 #00000066;
    --font-sans:"Plus Jakarta Sans", "Manrope", ui-sans-serif, system-ui, sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg-canvas); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; -webkit-font-smoothing:antialiased;}
  .app{position:relative; height:100%; display:flex; flex-direction:column;
    background:radial-gradient(120% 70% at 50% 34%, var(--bg-ambient) 0%, var(--bg-canvas) 62%), var(--bg-canvas);}
  .top{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px 0;}
  .overline{font-family:var(--font-mono); font-size:11px; line-height:16px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .ghost{font:600 13px/18px var(--font-sans); color:var(--text-secondary); background:transparent; border:1px solid var(--border-hairline); border-radius:999px; padding:8px 14px; cursor:pointer; transition:border-color .1s,color .1s;}
  .ghost:hover{border-color:var(--jade-300); color:var(--text-primary);}
  button:focus-visible, textarea:focus-visible{outline:2px solid var(--aqua-600); outline-offset:3px;}
  .stage{position:relative; flex:1; min-height:0;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .stage.voice{cursor:default;}
  .stage.voice.hot{cursor:pointer;}
  .stage:focus-visible{outline:none;}
  .stage:focus-visible canvas{outline:2px solid var(--aqua-600); outline-offset:-8px; border-radius:24px;}
  .speech small.live{color:var(--aqua-400); font-size:15px; line-height:22px; min-height:22px;}
  .wordmark{position:absolute; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; font:700 24px/1 var(--font-mono); pointer-events:none; z-index:1; transition:top .6s cubic-bezier(.2,.8,.2,1), font-size .6s;
    text-shadow:0 0 18px #080a0a, 0 0 6px #080a0a;}
  .app.intro .wordmark{font-size:38px;}
  .wordmark .letters{display:flex; gap:.5em;}
  .speech .wmsub{margin:0 auto 18px; font:600 14px/20px var(--font-mono); letter-spacing:.34em; text-transform:uppercase; color:var(--aqua-400); text-shadow:0 0 12px #2feada66, 0 0 14px #080a0a; padding-left:.34em;}
  .wordmark .wmsub{margin-top:.6em; font-size:.42em; font-weight:600; letter-spacing:.34em; text-transform:uppercase; color:var(--aqua-400); text-shadow:0 0 12px #2feada66, 0 0 14px #080a0a; padding-left:.34em;}
  .app:not(.intro) .wordmark .wmsub{display:none;}
  .wordmark span{color:#6ff5e6; animation:sweep 4.8s ease-in-out infinite both;}
  .wordmark span.dim{animation:none; color:#76807e;}
  @keyframes sweep{0%,100%{color:#6ff5e6; text-shadow:0 0 12px #2feada88, 0 0 18px #080a0a} 45%{color:#effffc; text-shadow:0 0 18px #2feadacc, 0 0 18px #080a0a} 70%{color:#6ff5e6; text-shadow:0 0 12px #2feada88, 0 0 18px #080a0a}}
  @media (prefers-reduced-motion: reduce){ .wordmark span{animation:none; color:#6ff5e6;} .wordmark span.dim{color:#76807e;} }
  @media (max-width:640px){ .wordmark{font-size:20px;} .app.intro .wordmark{font-size:30px;} }
  .speech{position:relative; z-index:2; text-align:center; padding:0 24px; margin:0 auto; max-width:23em; min-height:88px;}
  .speech p{margin:0; font-size:17px; line-height:28px; color:var(--text-primary); text-wrap:balance;}
  .speech p.big{font-size:26px; line-height:32px; font-weight:700; letter-spacing:-.01em;}
  .speech small{display:block; margin-top:8px; font-size:13px; line-height:18px; color:var(--text-muted); text-wrap:balance;}
  .dock{position:relative; z-index:3; padding:12px 24px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; align-items:center; gap:12px;}
  .field-wrap{width:100%; max-width:560px; background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:24px; padding:12px 18px; transition:border-color .1s;}
  .field-wrap:focus-within{border-color:var(--jade-300);}
  .field-wrap{display:flex; align-items:flex-end; gap:10px;}
  .field-wrap textarea{flex:1; min-width:0;}
  textarea{display:block; width:100%; box-sizing:border-box; resize:none; background:transparent; border:0; outline:0; color:var(--text-primary); font:400 16px/24px var(--font-sans); min-height:48px; max-height:120px;}
  textarea::placeholder{color:var(--text-muted);}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;}
  .primary{font:600 16px/22px var(--font-sans); border:0; border-radius:999px; padding:12px 24px; cursor:pointer; background:var(--aqua-400); color:var(--bg-deep); box-shadow:var(--glow-aqua); font-variant-numeric:tabular-nums;}
  .primary:disabled{background:var(--surface-sunk); color:var(--text-faint); box-shadow:none; border:1px solid var(--border-hairline); cursor:default;}
  .link{font:500 13px/18px var(--font-sans); color:var(--text-muted); background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:6px;}
  .link:hover{color:var(--text-secondary);}
  .fly{position:fixed; left:0; top:0; z-index:6; pointer-events:none; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding:6px 12px; border-radius:999px; background:var(--surface-raised); border:1px solid var(--aqua-600); color:var(--text-primary); font:500 13px/18px var(--font-sans); box-shadow:0 0 16px #2cb7af33;}
  /* stats */
  .panel{position:absolute; inset:0; z-index:8; background:var(--bg-canvas); display:flex; flex-direction:column; transform:translateY(24px); opacity:0; pointer-events:none; transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .25s;}
  .panel.open{transform:none; opacity:1; pointer-events:auto;}
  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:calc(20px + env(safe-area-inset-top,0px)) 24px 16px; max-width:688px; width:100%; margin:0 auto; box-sizing:border-box;}
  .panel-head h2{margin:8px 0 0; font-size:26px; line-height:32px; font-weight:700; letter-spacing:-.01em;}
  .panel-body{flex:1; overflow-y:auto; padding:0 24px 32px;}
  .list{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:8px;}
  .note{max-width:640px; margin:0 auto 16px; text-align:left; font-size:13px; line-height:18px; color:var(--text-muted);}
  .rowt{display:grid; grid-template-columns:1fr auto; gap:4px 16px; align-items:center; padding:14px 16px; background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:14px;}
  .rowt .t{font-size:15px; line-height:22px; font-weight:600; overflow-wrap:anywhere;}
  .rowt .n{font:500 15px/20px var(--font-mono); color:var(--aqua-400); font-variant-numeric:tabular-nums; text-align:right;}
  .rowt .c{grid-column:1/-1; font-size:13px; line-height:18px; color:var(--text-secondary); overflow-wrap:anywhere;}
  .strip{grid-column:1/-1; display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;}
  .strip i{width:8px; height:8px; border-radius:50%; background:var(--surface-sunk); border:1px solid var(--border-hairline);}
  .strip i.on{background:var(--aqua-600); border-color:var(--aqua-600);}
  .group-label{max-width:640px; margin:24px auto 10px;}
  .once{max-width:640px; margin:0 auto; display:flex; flex-wrap:wrap; gap:8px;}
  .once span{font-size:13px; line-height:18px; padding:6px 12px; border:1px solid var(--border-hairline); border-radius:999px; color:var(--text-secondary);}
  .top-right{display:flex; gap:8px; align-items:center;}
  .lang{display:flex; border:1px solid var(--border-hairline); border-radius:999px; padding:2px;}
  .lang button{font:500 11px/16px var(--font-mono); letter-spacing:.12em; color:var(--text-muted); background:transparent; border:0; border-radius:999px; padding:6px 10px; cursor:pointer;}
  .lang button[aria-pressed="true"]{background:var(--surface-raised); color:var(--text-primary);}
  .checkin{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .chip{font:600 15px/22px var(--font-sans); color:var(--text-primary); background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:999px; padding:10px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; transition:border-color .1s, box-shadow .1s;}
  .chip i{width:8px; height:8px; border-radius:50%; flex:none;}
  .chip:hover{border-color:var(--jade-300);}
  .chip[aria-pressed="true"]{border-color:var(--aqua-600); box-shadow:0 0 16px #2cb7af33;}
  .cilabel{font:600 13px/20px var(--font-mono); letter-spacing:.3em; text-transform:uppercase; color:var(--aqua-400); text-shadow:0 0 12px #2feada55, 0 1px 12px #080a0a; padding-left:.3em; margin-top:14px;}
  .step{font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--text-muted);}
  .tally{max-width:640px; margin:0 auto; display:flex; flex-wrap:wrap; gap:8px;}
  .tally span{display:flex; align-items:center; gap:8px; font-size:13px; line-height:18px; padding:6px 12px; border:1px solid var(--border-hairline); border-radius:999px; color:var(--text-secondary);}
  .tally span i{width:8px; height:8px; border-radius:50%;}
  .tally b{font:500 13px/18px var(--font-mono); color:var(--text-primary); font-variant-numeric:tabular-nums;}
  .history{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}
  .day{display:flex; flex-direction:column; gap:6px;}
  .day ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px;}
  .day li{font-size:15px; line-height:22px; color:var(--text-secondary); padding-left:14px; position:relative; overflow-wrap:anywhere;}
  .day li::before{content:""; position:absolute; left:0; top:9px; width:5px; height:5px; border-radius:50%; background:var(--jade-300);}
  .day mark{background:none; color:var(--aqua-400);}
  .privacy{max-width:640px; margin:32px auto 0; padding-top:20px; border-top:1px solid var(--border-hairline); display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
  .privacy p{margin:0; font-size:13px; line-height:18px; color:var(--text-muted);}
  .danger{font:600 13px/18px var(--font-sans); color:var(--text-secondary); background:transparent; border:1px solid var(--border-hairline); border-radius:999px; padding:8px 14px; cursor:pointer;}
  .danger.armed{border-color:#ed302a; color:#ecf2f4; box-shadow:0 0 22px 0 #ed302a40;}
  /* check-in tiles */
  .chips{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; width:100%; max-width:520px;}
  .chip{flex-direction:column; justify-content:center; gap:8px; padding:14px 4px; border-radius:16px; font-size:14px; line-height:18px; font-weight:500; min-height:84px; min-width:0;}
  .chip span{max-width:100%; overflow-wrap:normal; hyphens:manual; text-align:center;}
  @media (max-width:420px){ .chips{gap:6px;} .chip{padding:12px 2px; font-size:11.5px; letter-spacing:-.01em; min-height:78px; gap:7px;} .chip svg{width:24px; height:24px;} }
  .chip svg{width:26px; height:26px; flex:none;}
  .chip[aria-pressed="true"]{border-color:currentColor;}
  .checkin{transition:opacity .22s, transform .22s;}
  .checkin.leaving{opacity:0; transform:translateY(8px); pointer-events:none;}
  .ico{display:inline-block; width:16px; height:16px; vertical-align:-3px; flex:none;}
  /* brand in top bar (phones) */
  .brand{display:none!important; gap:.5em; font:600 14px/1 var(--font-mono);}
  .brand span{color:#4a5452;} .brand span.on{color:#6ff5e6; text-shadow:0 0 10px #2feada66;}
  /* panel: tabs, diary, analytics */
  .tabs, .seg{display:flex; gap:4px; padding:3px; border:1px solid var(--border-hairline); border-radius:999px; width:max-content; max-width:100%;}
  .tabs button, .seg button{font:600 14px/20px var(--font-sans); color:var(--text-muted); background:transparent; border:0; border-radius:999px; padding:8px 16px; cursor:pointer;}
  .seg button{font-size:13px; padding:6px 12px;}
  .tabs button[aria-selected="true"], .seg button[aria-pressed="true"]{background:var(--surface-raised); color:var(--text-primary);}
  .wrap{max-width:640px; margin:0 auto;}
  .tabbar{max-width:640px; margin:0 auto 20px;}
  .entry{padding:16px 0; border-top:1px solid var(--border-hairline); display:flex; flex-direction:column; gap:10px;}
  .entry-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .entry-head time{font:500 13px/18px var(--font-mono); color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .moods{display:flex; align-items:center; gap:6px; font-size:13px; line-height:18px; color:var(--text-secondary);}
  .moods .arrow{color:var(--text-faint);}
  .entry ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .entry li{font-size:16px; line-height:25px; color:var(--text-primary); overflow-wrap:anywhere;}
  .dayhead{font-size:20px; line-height:26px; font-weight:600; margin:28px 0 4px;}
  .dayhead:first-child{margin-top:0;}
  .empty{font-size:15px; line-height:22px; color:var(--text-muted); padding:24px 0;}
  .kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:16px 0 8px;}
  .kpi{background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:14px; padding:14px 16px;}
  .kpi b{display:block; font:500 26px/30px var(--font-mono); color:var(--text-primary); font-variant-numeric:tabular-nums;}
  .kpi span{font-size:13px; line-height:18px; color:var(--text-muted);}
  .sec{margin-top:28px;}
  .sec > .overline{margin-bottom:12px;}
  .bars{display:flex; flex-direction:column; gap:10px;}
  .bar{display:grid; grid-template-columns:132px 1fr 36px; align-items:center; gap:12px; font-size:14px; line-height:20px; color:var(--text-secondary);}
  .bar .lab{display:flex; align-items:center; gap:8px; min-width:0;}
  .bar .track{display:block; height:8px; border-radius:999px; background:var(--surface-sunk); overflow:hidden;}
  .bar .fill{display:block; height:100%; border-radius:999px;}
  .bar b{font:500 13px/18px var(--font-mono); color:var(--text-primary); text-align:right; font-variant-numeric:tabular-nums;}
  .shift{font-size:16px; line-height:25px; color:var(--text-primary); margin:0;}
  .days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
  .dcell{border:1px solid var(--border-hairline); border-radius:12px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:74px; background:var(--surface-sunk);}
  .dcell.has{background:var(--surface-raised);}
  .dcell small{font:500 11px/14px var(--font-mono); color:var(--text-muted); letter-spacing:.04em;}
  .dcell .ico{width:18px; height:18px;}
  .dcell.none .ico{opacity:0;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-muted);}
  .copybox{margin-top:28px; padding:16px; border:1px solid var(--border-hairline); border-radius:14px; display:flex; flex-direction:column; gap:10px; align-items:flex-start;}
  .copybox p{margin:0; font-size:14px; line-height:21px; color:var(--text-secondary);}
  .copybox h4{margin:0; font-size:18px; line-height:24px; font-weight:600; color:var(--text-primary);}
  .copybox .steps{margin:2px 0 6px; padding-left:22px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:21px; color:var(--text-secondary);}
  .copybox .steps li::marker{font-family:var(--font-mono); color:var(--aqua-600);}
  .copybox .foot{font-size:13px; line-height:18px; color:var(--text-muted);}
  .copybox .warn{font-size:13px; line-height:19px; color:#e9c14d; border-left:0; padding:10px 12px; border-radius:10px; background:rgba(233,193,77,.07);}
  .copybox .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .copybox{gap:12px;}
  .primary.sm{font-size:14px; padding:10px 18px;}
  /* PIN pad */
  .pin{display:flex; flex-direction:column; align-items:center; gap:18px; padding:28px 0 8px; text-align:center;}
  .pin h3{margin:0; font-size:22px; line-height:28px; font-weight:600;}
  .pin p{margin:0; max-width:32em; font-size:14px; line-height:20px; color:var(--text-muted); text-wrap:balance;}
  .pin .warn{color:#e9c14d;}
  .dots{display:flex; gap:16px; margin:4px 0;}
  .dots i{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--jade-300); transition:background .12s, box-shadow .12s;}
  .dots i.on{background:var(--aqua-400); border-color:var(--aqua-400); box-shadow:0 0 12px #2feada66;}
  .pin.shake .dots{animation:shake .38s;}
  @keyframes shake{20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)}}
  .keys{display:grid; grid-template-columns:repeat(3,72px); gap:12px;}
  .keys button{width:72px; height:72px; border-radius:50%; border:1px solid var(--border-hairline); background:var(--surface-raised); color:var(--text-primary); font:500 26px/1 var(--font-mono); cursor:pointer; transition:border-color .1s, background .1s;}
  .keys button:hover{border-color:var(--jade-300);}
  .keys button:active{background:var(--surface-sunk);}
  .keys button.fn{background:transparent; border-color:transparent; font:600 14px/1 var(--font-sans); color:var(--text-muted);}
  .keys button:disabled{opacity:.35; cursor:default;}
  .pin .err{min-height:20px; color:#ed302a; font-size:14px;}
  .linkbtn{font:500 13px/18px var(--font-sans); color:var(--text-muted); background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4px;}
  .linkbtn:hover{color:var(--text-secondary);}
  /* start screen: sphere + drifting hints */
  .hints{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
  .caption{position:absolute; left:50%; top:0; transform:translate(-50%,-50%); margin:0; width:max-content; max-width:calc(100% - 32px); text-align:center; text-wrap:balance;
    font:500 13px/21px var(--font-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--aqua-400); text-shadow:0 0 12px #2feada44, 0 1px 14px #080a0a;
    opacity:0; filter:blur(5px); transition:opacity .9s ease, filter .9s ease;}
  .caption.show{opacity:1; filter:blur(0);}
  @media (max-width:640px){ .caption{font-size:12px; line-height:20px; letter-spacing:.12em;} }
  @media (prefers-reduced-motion: reduce){ .caption{transition:none; filter:none;} }
  .hint{position:absolute; left:0; top:0; white-space:nowrap; font:500 15px/20px var(--font-sans); color:var(--text-secondary);
    text-shadow:0 1px 12px #080a0a, 0 0 2px #080a0a; opacity:0; animation:hintLife 6.4s ease-in-out forwards;}
  .hint.acc{color:var(--aqua-400);}
  @keyframes hintLife{0%{opacity:0; translate:0 10px} 16%{opacity:1} 74%{opacity:1} 100%{opacity:0; translate:0 -22px}}
  .app.intro .dock, .app.intro #count, .app.intro #open-stats{visibility:hidden; pointer-events:none;}
  .app.intro .dock{display:none;}
  .app.intro .stage{cursor:pointer;}
  .app.intro::after{display:none;}
  .speech .tagline{margin:0 auto 12px; max-width:22em; font:600 19px/27px var(--font-sans); color:var(--text-primary); text-wrap:balance;}
  .speech .tagsub{margin:6px auto 16px; font-size:14px; line-height:20px; font-weight:400; color:var(--text-muted);}
  .app.intro .speech{padding-bottom:6vh; max-width:30em;}
  @media (max-width:640px){ .speech .tagline{font-size:17px; line-height:24px;} .speech .tagsub{font-size:13px;} .app.intro .speech{padding-bottom:4vh;} }

  const ROWS=58, COLS=104, pts=[];

  /* ---------- lock: thoughts are sealed with a public key; only the PIN opens the private key ---------- */
  const LOCK='exhale-lock-v1';
  const SUB=crypto.subtle, EC={name:'ECDH', namedCurve:'P-256'};

    localStorage.setItem(LOCK, JSON.stringify({v:1, pub:pubRaw, salt:b64(salt), iv:b64(iv), wrapped:b64(wrapped)}));

  async function sealThoughts(thoughts){
    const lk=getLock();
    const pub=await SUB.importKey('raw', unb64(lk.pub), EC, false, []);
    const eph=await SUB.generateKey(EC, true, ['deriveKey']);
    const aes=await SUB.deriveKey({name:'ECDH', public:pub}, eph.privateKey, {name:'AES-GCM', length:256}, false, ['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await SUB.encrypt({name:'AES-GCM', iv}, aes, enc.encode(JSON.stringify(thoughts)));
    return {epk:b64(await SUB.exportKey('raw', eph.publicKey)), iv:b64(iv), ct:b64(ct)};
  }
  async function openThoughts(box){
    const epk=await SUB.importKey('raw', unb64(box.epk), EC, false, []);
    const aes=await SUB.deriveKey({name:'ECDH', public:epk}, priv, {name:'AES-GCM', length:256}, false, ['decrypt']);

  async function setupLock(pin){

    const all=JSON.parse(localStorage.getItem(LS)||'[]');

  function pinPad(box, mode, done, opts={}){

    };

    if(mode==='unlock'){

  /* ---------- formulate + sort ---------- */
  async function formulate(frags, themes){
    if(sample){
      try{
        const res=await sample.json(
`A person is dumping their thoughts as a stream to clear their head. Below are fragments of what they said.
Task: formulate the separate thoughts and give each a theme.
- One thought = one subject. Merge fragments about the same thing, split ones that hold several.
- Keep each short (up to 8 words), first person, in the person's own words and in the SAME LANGUAGE as the fragments. No advice, no judgement, no conclusions.
- theme: 1-3 words, a noun, what the thought is about (e.g. "Landlord", "Mom", "Work"), in the same language as the fragments.
- If the theme matches one of the known themes, reuse that name EXACTLY as written.
Known themes: ${JSON.stringify(themes)}
Fragments: ${JSON.stringify(frags)}
Reply with JSON only: {"thoughts":[{"text":"...","theme":"..."}]}`,
          {modelTier:'quick'});
        if(res && Array.isArray(res.thoughts) && res.thoughts.length)
          return res.thoughts.filter(t=>t&&t.text).map(t=>({text:String(t.text).slice(0,120), theme:String(t.theme||t.text).slice(0,40)}));
      }catch(e){}
    }
    // local fallback: each fragment is a thought, theme = matching known theme or its first words
    return frags.map(f=>({text:f, theme:''}));
    return frags.map(f=>{
      const nf=norm(f); const hit=themes.find(t=>nf.includes(norm(t)));
      return {text:f, theme: hit || f.split(/\s+/).slice(0,3).join(' ')};
    });
  }

    const today=startOfDay(Date.now());
    let first = period==='week' ? today-6*DAYMS : period==='month' ? today-29*DAYMS : startOfDay(Math.min(...list.map(d=>d.at)));
    if(period==='all' && (today-first)/DAYMS>89) first=today-89*DAYMS;
    const wd=new Intl.DateTimeFormat(lang==='uk'?'uk-UA':'en-GB',{weekday:'short'}), dm=new Intl.DateTimeFormat(lang==='uk'?'uk-UA':'en-GB',{day:'numeric'});
    for(let ts=first; ts<=today; ts+=DAYMS){
      const day=list.filter(d=>startOfDay(d.at)===startOfDay(ts));
      const pick=key=>{ const c={}; day.forEach(d=>{ if(d[key]) c[d[key]]=(c[d[key]]||0)+1; }); const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return e&&e[0]; };
      const mo=pick('mood'), bo=pick('body');
      const c=document.createElement('div'); c.className='dcell'+(day.length?' has':'');
      c.innerHTML='<small></small>'+(mo?icon(mo):'<svg class="ico"></svg>')+(bo?icon(bo):'<svg class="ico"></svg>');
      c.querySelector('small').textContent = period==='week' ? wd.format(new Date(ts)) : dm.format(new Date(ts));
      if(day.length) c.title=day.length+' · '+[mo&&t.mood[mo], bo&&t.body[bo]].filter(Boolean).join(', ');
      grid.appendChild(c);
    }
    const lg=document.createElement('div'); lg.className='legend'; lg.innerHTML='<span></span><span></span>'; lg.children[0].textContent=t.legMood; lg.children[1].textContent=t.legBody; dd.appendChild(lg);
    // shift
    const pairs=list.filter(d=>d.mood&&d.moodAfter);
    if(pairs.length){
      let b=0,sm=0,w=0; pairs.forEach(d=>{ const x=VAL[d.moodAfter]-VAL[d.mood]; if(x>0)b++; else if(x<0)w++; else sm++; });
      const s2=sec(t.moodAfterT2); const p=document.createElement('p'); p.className='shift'; p.textContent=t.shiftLine(b,sm,w,pairs.length); s2.appendChild(p);
      const bb=document.createElement('div'); bb.className='bars'; bb.style.marginTop='14px'; s2.appendChild(bb); bars(bb,'moodAfter',list);
    }
    const s1=sec(t.moodBeforeT); const b1=document.createElement('div'); b1.className='bars'; s1.appendChild(b1); bars(b1,'mood',list);
    const s3=sec(t.bodyT); const b3=document.createElement('div'); b3.className='bars'; s3.appendChild(b3); bars(b3,'body',list);
    // copy for deeper analysis
    const cb=document.createElement('div'); cb.className='copybox';
    cb.innerHTML='<h4></h4><p class="intro"></p><ol class="steps"></ol><div class="btns"></div><p class="warn"></p><p class="foot"></p>';
    cb.querySelector('h4').textContent=t.copyT; cb.querySelector('.intro').textContent=t.copyNote;
    t.copySteps.forEach(x=>{ const li=document.createElement('li'); li.textContent=x; cb.querySelector('.steps').appendChild(li); });
    cb.querySelector('.warn').textContent=t.copyWarn; cb.querySelector('.foot').textContent=t.copyFoot(t.periodLabel[period]);
    const btns=cb.querySelector('.btns');
    [['psy', t.copyPsy], ['ai', t.copyAi]].forEach(([kind, label])=>{
      const btn=document.createElement('button'); btn.type='button'; btn.className='ghost'; btn.textContent=label; btns.appendChild(btn);
      btn.onclick=()=>{
        if(hasLock() && !priv){
          btns.hidden=true; const pad=document.createElement('div'); cb.insertBefore(pad, cb.querySelector('.warn'));
          pinPad(pad, 'unlock', async()=>{ await openAll(list); renderAnalytics(); }, {sub:t.pinCopySub, onCancel:()=>renderAnalytics()});
          return;
        }
        const fmt=new Intl.DateTimeFormat(lang==='uk'?'uk-UA':'en-GB',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
        const entries=list.slice().sort((a,b)=>a.at-b.at).map(d=>{
          const mb=[d.mood&&(t.mood[d.mood]), d.moodAfter&&('→ '+t.mood[d.moodAfter]), d.body&&(t.bodyT+': '+t.body[d.body])].filter(Boolean).join(' ');
          return fmt.format(new Date(d.at))+(mb?' ('+mb+')':'')+'\n'+thoughtsOf(d).map(x=>'- '+x.text).join('\n');
        }).join('\n\n');
        const txt=(kind==='ai' ? t.copyPrompt+'\n\n' : '')+t.copyHead(t.periodLabel[period])+'\n\n'+entries;
        const ok=()=>{ SFX.pick(4); btn.textContent=t.copied; setTimeout(()=>btn.textContent=label, 3000); };
        try{ navigator.clipboard.writeText(txt).then(ok, ()=>fallback()); }catch(e){ fallback(); }
        function fallback(){ const old=cb.querySelector('textarea'); if(old) old.remove(); const ta2=document.createElement('textarea'); ta2.value=txt; ta2.readOnly=true; ta2.style.cssText='width:100%;box-sizing:border-box;min-height:160px;background:var(--surface-sunk);color:var(--text-primary);border:1px solid var(--border-hairline);border-radius:10px;padding:10px;font:13px/18px var(--font-sans)'; btns.after(ta2); ta2.select(); btn.textContent=t.copyFail; }
      };
    });
    box.appendChild(cb);
  }
  $('tab-diary').onclick=()=>{ SFX.tap(); tab='diary'; render(viewDumps, viewExample); };
  $('tab-an').onclick=()=>{ SFX.tap(); tab='an'; render(viewDumps, viewExample); };
  const STOP=new Set(('треба мабуть може можу можна тому дуже щось якщо коли тепер зараз сьогодні навіть взагалі знову також тільки просто того цього цьому цей цих який яка яке які якого мене мені мною тебе тобі його вона воно вони нашу наша наше наші свою своє свій свої бути буде було була були хочу хоче хочеш нарешті думаю думка думки чому тоді поки після перед через щоб або ніби наче майже досі вже хоча десь кудись завжди ніколи інколи іноді типу все всі усе усі весь вся тут там ось отже знаю напевно справді потрібно потім зовсім зробити робити'
    +' about that this with have just what when where then they them there really maybe need want still again also from into would could should think thinking okay yeah like some thing things because know going will been were your mine more much very even only ever never always every today now tomorrow').split(/\s+/));
  function words(text){ return (text.toLowerCase().match(/[\p{L}'’-]+/gu)||[]).map(w=>w.replace(/^['’-]+|['’-]+$/g,'')).filter(w=>w.length>=4 && !STOP.has(w)); }
  function stem(w){ return w.length<=5 ? w.slice(0,w.length-1) : w.slice(0,5); }
  $('wipe').onclick=()=>{
    const b=$('wipe');
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent=L().wipeSure; clearTimeout(b._t); b._t=setTimeout(()=>{ b.classList.remove('armed'); b.textContent=L().wipe; }, 4000); return; }
    try{ localStorage.removeItem(LS); localStorage.removeItem(LOCK); }catch(e){}
    lockNow();
    render(example(), true);
    $('stats-meta').textContent=L().wiped+' '+$('stats-meta').textContent;
  };
  $('open-stats').onclick=async()=>{
    SFX.tap();
    const d=await loadDumps();
    render(d.length?d:example(), !d.length);
    $('panel').classList.add('open'); $('close-stats').focus();
  };
  function closePanel(){ $('panel').classList.remove('open'); lockNow(); $('open-stats').focus(); }
  $('close-stats').onclick=closePanel;
  addEventListener('keydown',e=>{ if(e.key==='Escape' && $('panel').classList.contains('open')) closePanel(); });
  $('pin-change').onclick=()=>{ const box=$('diary'); $('pin-change').hidden=true; $('pin-lock').hidden=true;
    pinPad(box, 'change', ()=>{ render(viewDumps, viewExample); $('stats-meta').textContent=L().pinChanged; }, {onCancel:()=>render(viewDumps, viewExample)}); };
  $('pin-lock').onclick=()=>{ lockNow(); render(viewDumps, viewExample); };

  /* ---------- voice: tap the sphere ---------- */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, listening=false, lastFinal='', lastFinalAt=0, restartT=null, buf='', bufT=null;
  const SILENCE=2600;   // a thought ends after this much quiet
  const nrm=t=>t.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
  function liveLine(text){
    speech.textContent='';
    const p=document.createElement('p'); p.className='big'; p.textContent=L().listenTitle; speech.appendChild(p);
    const sm=document.createElement('small'); sm.className='live'; sm.textContent=text||''; speech.appendChild(sm);
    if(!text){ const h=document.createElement('small'); h.textContent=L().micOn; speech.appendChild(h); }
  }
  function commit(raw){
    let t=raw.replace(/\s+/g,' ').trim(); if(!t) return;
    const nt=nrm(t), now=Date.now();
    if(now-lastFinalAt<8000 && lastFinal){
      if(nt===lastFinal || lastFinal.startsWith(nt)) return;            // repeated result
      if(nt.startsWith(lastFinal)){ t=t.split(/\s+/).slice(lastFinal.split(' ').length).join(' '); if(!t.trim()) return; } // cumulative result
    }
    lastFinal=nt; lastFinalAt=now;
    buf=(buf?buf+' ':'')+t;
    liveLine(buf); holdBuffer();
  }
  function holdBuffer(){ clearTimeout(bufT); bufT=setTimeout(flushBuffer, SILENCE); }
  function flushBuffer(){
    clearTimeout(bufT); const t=buf.trim(); buf='';
    if(t) absorb(t.charAt(0).toUpperCase()+t.slice(1));
    if(listening) liveLine('');
  }
  function startMic(){
    if(!SR){ say(L().ask, L().noVoice); return; }
    listening=true; listenLvl=1; liveLine(''); SFX.micOn();
    stage.setAttribute('aria-pressed','true');
    runRec();
  }
  function runRec(){
    try{ rec&&rec.abort(); }catch(e){}
    rec=new SR();
    rec.lang=L().speech;          // explicit: uk-UA or en-US
    rec.continuous=false;         // one utterance per session: fewer duplicates on Android and iOS
    rec.interimResults=true;
    rec.maxAlternatives=1;
    rec.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal){ commit(r[0].transcript); }
        else interim+=r[0].transcript;
      }
      if(interim){ liveLine((buf?buf+' ':'')+interim); voiceKick(); if(buf) holdBuffer(); }
    };
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){ stopMic(); say(L().ask, L().micDenied); }
    };
    rec.onend=()=>{ if(listening){ clearTimeout(restartT); restartT=setTimeout(runRec, 150); } };
    try{ rec.start(); }catch(e){}
  }
  function stopMic(){
    if(!listening) return;
    listening=false; listenLvl=0; clearTimeout(restartT); flushBuffer(); SFX.micOff();
    stage.setAttribute('aria-pressed','false');
    try{ rec&&rec.stop(); }catch(e){}
    if(rerender===showAsk) showAsk();
  }
  function voiceKick(){ pulse=performance.now()-350; kick(); }
  const onSphere=(x,y)=>{ const r=stage.getBoundingClientRect(); return Math.hypot(x-r.left-CX, y-r.top-CY) < R*1.3; };
  if(SR){
    stage.classList.add('voice');
    stage.setAttribute('role','button'); stage.tabIndex=0;
    stage.addEventListener('pointermove', e=>stage.classList.toggle('hot', onSphere(e.clientX,e.clientY)));
    stage.addEventListener('click', e=>{ if(!onSphere(e.clientX,e.clientY) || rerender!==showAsk) return; listening?stopMic():startMic(); });
    stage.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && rerender===showAsk){ e.preventDefault(); listening?stopMic():startMic(); } });
  }
  exhaleBtn.addEventListener('click', ()=>{ stopMic(); }, true);

  let lastDumps=null;
  function applyLang(){
    const t=L(); document.documentElement.lang=lang; document.title=t.title;
    document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t[el.dataset.t]; });
    ta.placeholder=t.placeholder; paintSnd(); stage.setAttribute('aria-label', t.micLabel); stopMic();
    const br=$('brand'); br.textContent=''; [...t.name[0]].forEach(ch=>{ const sp=document.createElement('span'); sp.textContent=ch; br.appendChild(sp); }); [...t.name[1]].forEach(ch=>{ const sp=document.createElement('span'); sp.className='on'; sp.textContent=ch; br.appendChild(sp); });
    const wm=$('wordmark'); wm.textContent=''; wm.setAttribute('aria-label', t.title);
    const [dim,lit]=t.name; let i=0;
    const row=document.createElement('div'); row.className='letters'; wm.appendChild(row);
    [...dim].forEach(ch=>{ const sp=document.createElement('span'); sp.className='dim'; sp.textContent=ch; row.appendChild(sp); });
    [...lit].forEach(ch=>{ const sp=document.createElement('span'); sp.textContent=ch; sp.style.animationDelay=(i++*0.3)+'s'; row.appendChild(sp); });
    document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang?'true':'false'));
    rerender(); updateCount();
    if($('panel').classList.contains('open')) $('open-stats').click();
  }
  function paintSnd(){ const b=$('snd'); b.setAttribute('aria-pressed', SFX.on); b.setAttribute('aria-label', SFX.on ? L().sndOn : L().sndOff); b.title=b.getAttribute('aria-label'); }
  $('snd').onclick=()=>{ SFX.set(!SFX.on); paintSnd(); if(SFX.on) SFX.pick(2); };
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ SFX.tap(); lang=b.dataset.lang; try{localStorage.setItem('exhale-lang',lang);}catch(e){} applyLang(); });
  /* ---------- start screen ---------- */
  /* one calm caption at a time, under the wordmark: fade in, hold, fade out */
  const ACC=new Set([0,3]);
  let capT=null, capN=0;
  function placeCaption(){ const c=$('hints').querySelector('.caption'); if(c) c.style.top=(CY-R*1.2-(matchMedia('(max-width:640px)').matches?34:40))+'px'; }
  function nextCaption(){
    const box=$('hints'); let c=box.querySelector('.caption');
    if(!c){ c=document.createElement('p'); c.className='caption'; box.appendChild(c); }
    const list=L().hints, i=capN++%list.length;
    c.classList.remove('show');
    capT=setTimeout(()=>{
      c.textContent=list[i]; placeCaption();
      requestAnimationFrame(()=>c.classList.add('show'));
      capT=setTimeout(nextCaption, reduce?4200:3600);
    }, capN===1 ? 500 : (reduce?0:1000));
  }
  function startHints(){ clearTimeout(capT); $('hints').textContent=''; capN=0; nextCaption(); }
  function stopHints(){ clearTimeout(capT); capT=null; const c=$('hints').querySelector('.caption'); if(c){ c.classList.remove('show'); setTimeout(()=>{ if(rerender!==showIntro) $('hints').textContent=''; }, 900); } }
  function showIntro(){
    rerender=showIntro;
    $('app').classList.add('intro');
    speech.textContent='';
    const tg=document.createElement('p'); tg.className='tagline'; tg.textContent=L().tagline;
    const b=document.createElement('button'); b.type='button'; b.className='startbtn'; b.textContent=L().startBtn; b.onclick=leaveIntro;
    const jr=document.createElement('p'); jr.className='wmsub'; jr.textContent=L().wmsub;
    speech.append(tg, jr, b);
    resize(); startHints();
  }
  function leaveIntro(){
    if(rerender!==showIntro) return;
    $('app').classList.remove('intro'); stopHints(); resize();
    pulse=performance.now(); kick(); SFX.start();
    requestAnimationFrame(resize);
    startSession();
  }
  stage.addEventListener('click', e=>{ if(rerender===showIntro && onSphere(e.clientX,e.clientY)) leaveIntro(); });
  stage.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && rerender===showIntro){ e.preventDefault(); leaveIntro(); } });

  applyLang();
  showIntro();
  resize(); updateCount(); requestAnimationFrame(frame);
})();
